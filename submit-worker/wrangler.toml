# Cloudflare Worker that receives Eggy Cup logs from submit.html.
# Setup steps: see README.md. Secrets (TURNSTILE_SECRET, POLLER_TOKEN) are
# set with `npx wrangler secret put`, never written here.
name = "eggy-submit"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[kv_namespaces]]
binding = "SUBMISSIONS"
# Replace both with the ids printed by:
#   npx wrangler kv namespace create EGGY_SUBMISSIONS
#   npx wrangler kv namespace create EGGY_SUBMISSIONS --preview
id = "8f0e00403fbf4b498c56a81c1c8505d5"
preview_id = "750ba43373ed435486c643d6347ddf9e"

[vars]
ALLOWED_ORIGINS = "https://aizpunr.github.io,http://localhost:9004,http://127.0.0.1:9004"
TURNSTILE_HOSTNAMES = "aizpunr.github.io,localhost,127.0.0.1"
MAX_BYTES = "5242880"
MAX_INDEX = "200"
DAILY_SUBMIT_CAP = "20"
